<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Buchung</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header>
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Nachhilfe Connect Logo">
            <p>Gemeinsam besser lernen.</p>
        </div>
    
        <h1>Nachhilfe Connect</h1>
    
        <nav>
            <ul>
                <li><a href="{{ url_for('startseite') }}">Startseite</a></li>
                <li><a href="{{ url_for('teacher_search') }}">Suche</a></li>
                <li><a class="active" href="{{ url_for('booking') }}">Buchung</a></li>
                <li><a href="{{ url_for('profile') }}">Profil</a></li>
                <li><a class="login-button" href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
    <section class="booking-container">
        <div class="booking-card">
            <h2>Nachhilfe buchen</h2>
            <p class="teacher-info">
                Lehrer: <strong>{{ teacher_name }}</strong>
            </p>
            <form>
                <div class="form-group">
                    <label>Datum</label>
                    <input type="date">
                </div>
                
                <div class="form-group">
                    <label>Uhrzeit</label>
                    <input type="time">
                </div>

                <div class="form-group">
                    <label>Unterrichtsart</label>
                    <select>
                        <option>Online</option>
                        <option>Vor Ort</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nachricht</label>
                    <textarea rows="5" placeholder="Beschreibe kurz dein Anliegen"></textarea>
                </div>

                <button type="submit" class="booking-btn">
                    Buchungsanfrage senden
                </button>
            </form>
        </div>
    </section>

</main>
    

</body>
</html>
