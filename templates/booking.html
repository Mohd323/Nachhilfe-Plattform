<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Buchung</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header>
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Nachhilfe Connect Logo">
            <p>Gemeinsam besser lernen.</p>
        </div>
    
        <h1>Nachhilfe Connect</h1>
    
        <nav>
            <ul>
                <li><a href="{{ url_for('startseite') }}">Startseite</a></li>
                <li><a href="{{ url_for('teacher_search') }}">Suche</a></li>
                <li><a class="active" href="{{ url_for('booking') }}">Buchung</a></li>
                <li><a href="{{ url_for('profile') }}">Profil</a></li>
                <li><a class="login-button" href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
    <section class="booking-container">
        <div class="booking-card">
            <h2>Nachhilfe buchen</h2>
            <p class="teacher-info">
                Lehrer: <strong>{{ lehrer.user.vorname }} {{ lehrer.user.nachname }}</strong>
            </p>

            <p class="teacher-info">
                Preis: <strong>{{ lehrer.stundenpreis }} € / Stunde</strong>
            </p>

            <form method="POST" action="{{ url_for('booking_teacher', lehrer_id=lehrer.id) }}">
                
                <div class="form-group">
                    <label>Fach</label>
                    <select name="fach_id" required>
                        {% for lehrer_fach in lehrer.faecher %}
                            <option value="{{ lehrer_fach.fach.id }}">
                                {{ lehrer_fach.fach.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Datum</label>
                    <input type="date" name="datum" required>
                </div>
                
                <div class="form-group">
                    <label>Uhrzeit</label>
                    <input type="time" name="uhrzeit" required>
                </div>

                <div class="form-group">
                    <label>Dauer</label>
                    <select name="dauer_stunden" required>
                        <option value="1">1 Stunde</option>
                        <option value="2">2 Stunden</option>
                        <option value="3">3 Stunden</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Unterrichtsart</label>
                    <select name="unterrichtsart" required>
                        <option value="online">Online</option>
                        <option value="vor_ort">Vor Ort</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Zahlungsart</label>
                    <select name="zahlungsart" required>
                        <option value="paypal">PayPal</option>
                        <option value="ueberweisung">Überweisung</option>
                        <option value="bar">Barzahlung</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nachricht</label>
                    <textarea name="nachricht" rows="5" placeholder="Beschreibe kurz dein Anliegen"></textarea>
                </div>

                <button type="submit" class="booking-btn">
                    Buchungsanfrage senden
                </button>
            </form>
        </div>
    </section>

</main> 

</body>
</html>
